plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.lipreux.basesecrete'
version = '1.0.0'

android {
  namespace "expo.modules.bsnative"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=none"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}
